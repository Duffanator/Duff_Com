[sdl]
fullscreen        = false
fulldouble        = false
fullresolution    = desktop
windowresolution  = 960x720
output            = openglnb
autolock          = true
sensitivity       = 100
usesystemcursor   = false
mouse_emulation   = always
waitonerror       = true

[dosbox]
title   = DUFF-COM: Coopersburg Defense Force (MS-DOS)
machine = svga_s3
memsize = 16

[render]
frameskip = 0
aspect    = true
doublescan = true
scaler    = normal2x

[cpu]
core    = dynamic
cputype = auto
cycles  = max

[mixer]
nosound   = false
rate      = 44100
blocksize = 1024
prebuffer = 20

[sblaster]
sbtype  = sb16
sbbase  = 220
irq     = 7
dma     = 1
hdma    = 5
sbmixer = true
oplmode = auto
oplemu  = default

[dos]
ems   = true
umb   = true
int33 = true
